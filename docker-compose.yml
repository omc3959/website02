version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: odoo-hub-app
    ports:
      - "3000:3000"
    environment:
      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      # NextAuth
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}

      # Odoo Configuration
      ODOO_URL: ${ODOO_URL}
      ODOO_DATABASE: ${ODOO_DATABASE}
      ODOO_USERNAME: ${ODOO_USERNAME}
      ODOO_PASSWORD: ${ODOO_PASSWORD}

      # Node Environment
      NODE_ENV: production

    restart: unless-stopped

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  node_modules:
    driver: local

networks:
  default:
    name: odoo-hub-network
    driver: bridge
